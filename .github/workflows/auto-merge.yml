# auto-merge.yml — Enable auto-merge on every PR opened and merge when CI passes.
#
# When a PR is opened or updated, this workflow enables GitHub's auto-merge
# for that PR.  Auto-merge will squash-merge the PR to main as soon as all
# required status checks are green and branch protection rules are satisfied.
#
# Required repo setting: Settings → General → "Allow auto-merge" must be ON.
# Required branch protection: main must require the CI status checks to pass
#   (typecheck, lint, build, a11y, design, csp, deploy-guard).
name: Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --auto \
            --squash \
            --delete-branch \
          || echo "auto-merge already enabled or blocked (waiting for CI)."
        env:
          GH_TOKEN: ${{ github.token }}