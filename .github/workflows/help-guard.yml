# help-guard.yml — Keep the staff help page in step with the UI it documents.
#
# /console/help (src/app/(console)/console/help/) describes console and
# door-staff procedures using the real button labels and field names. When a
# PR changes that UI, or the APIs / booking / check-in logic behind it, but
# leaves the help directory untouched, this check fails and comments on the PR.
#
# Watched paths:
#   src/app/(console)/**/*.tsx              console UI (help dir excluded)
#   src/app/(check-in)/**/*.tsx             door-staff UI
#   src/app/(console)/console/api/**/*.ts   console API endpoints
#   src/components/console/**/*.tsx         shared console components
#   src/lib/bookings/**/*.ts, src/lib/check-in/**/*.ts
#
# Opt out when the change affects no documented procedure: put [skip-help]
# in the PR's latest commit message, its title, or its description.
#
# When the help files do change, the project is type-checked so a broken
# help page fails here with a clear pointer.
#
# Comments use the workflow's GITHUB_TOKEN (the gh-as wrapper is a local
# workstation tool and does not exist on Actions runners). On fork PRs the
# token is read-only, so the comment is skipped but the check still fails.
name: Help guard

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when [skip-help] is added to the title/body.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: help-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  help-guard:
    name: Help content guard
    runs-on: ubuntu-latest
    steps:
      # The default ref is the PR merge commit, whose parents are the base tip
      # and the PR head. Full history makes both available to git diff.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Check whether help needs updating
        id: detect
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Passed via env, never interpolated into the script (injection-safe).
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}")
          echo "Changed files vs origin/${BASE_REF}:"
          echo "${changed:-  (none)}" | sed 's/^/  /'

          help_re='^src/app/\(console\)/console/help/'
          watched_re='^(src/app/\((console|check-in)\)/.*\.tsx|src/app/\(console\)/console/api/.*\.ts|src/components/console/.*\.tsx|src/lib/(bookings|check-in)/.*\.ts)$'

          help_changed=false
          if grep -Eq "$help_re" <<<"$changed"; then help_changed=true; fi
          watched=$(grep -E "$watched_re" <<<"$changed" | grep -Ev "$help_re" || true)

          head_msg=$(git log -1 --format=%B "$HEAD_SHA")
          skip=false
          if grep -Fq '[skip-help]' <<<"${head_msg}"$'\n'"${PR_TITLE}"$'\n'"${PR_BODY}"; then skip=true; fi

          status=ok
          if [ -n "$watched" ] && [ "$help_changed" = false ]; then
            if [ "$skip" = true ]; then status=skipped; else status=needs_update; fi
          fi

          echo "help_changed=$help_changed" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo 'watched<<__HELP_GUARD_EOF__'
            echo "$watched"
            echo '__HELP_GUARD_EOF__'
          } >> "$GITHUB_OUTPUT"

          echo "help changed: $help_changed | [skip-help]: $skip | result: $status"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.detect.outputs.status }}
          WATCHED: ${{ steps.detect.outputs.watched }}
        run: |
          set -uo pipefail
          marker='<!-- help-guard -->'
          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" 2>/dev/null | head -n1)

          if [ "$STATUS" = needs_update ]; then
            files=$(head -n 20 <<<"$WATCHED" | sed 's/^/- `/; s/$/`/')
            more=$(( $(wc -l <<<"$WATCHED") - 20 ))
            [ "$more" -gt 0 ] && files="${files}"$'\n'"- …and ${more} more"
            body=$(cat <<EOF
          ${marker}
          > ⚠️ Admin/Staff UI or workflow files changed but \`/console/help\` was not updated.
          > If your change affects any documented procedure, please update the help page.
          > If this change does not affect any documented procedure, re-run with an empty commit containing \`[skip-help]\`.

          Changed files that the help page may describe:
          ${files}

          Help content lives in \`src/app/(console)/console/help/help-content.ts\`. To skip:
          \`git commit --allow-empty -m "chore: no help changes needed [skip-help]" && git push\`
          (or add \`[skip-help]\` to the PR description).
          EOF
            )
          elif [ -n "$existing" ]; then
            # An earlier run complained; mark it resolved rather than leave it stale.
            if [ "$STATUS" = skipped ]; then
              note='skipped with `[skip-help]`'
            else
              note='the help page was updated (or no watched files changed)'
            fi
            body="${marker}"$'\n'"✅ Help guard passed: ${note}."
          else
            echo "Nothing to comment."
            exit 0
          fi

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" >/dev/null \
              || echo "::warning::Could not update the help-guard comment (read-only token on fork PRs?)."
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body" \
              || echo "::warning::Could not comment on the PR (read-only token on fork PRs?)."
          fi

      - name: Fail when help was not updated
        if: steps.detect.outputs.status == 'needs_update'
        run: |
          echo "::error title=Help not updated::Console / check-in UI changed but src/app/(console)/console/help/ did not. Update the help content, or add [skip-help] to the latest commit message or the PR description."
          exit 1

      # Only when the help files changed: make sure the page still compiles.
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.help_changed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Type-check help page
        if: steps.detect.outputs.help_changed == 'true'
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
