# investigate-login.yml — on-demand Playwright probe of the admin login
# spinner against the LIVE test deployment.
#
# The admin password is not available in CI secrets, so the default run
# exercises the deterministic FAILURE path (wrong credentials → 401). The
# script still records the full data-form-ready mutation sequence, overlay
# appearance/dismissal, /api/* traffic, and console errors — which is enough
# to diagnose whether the overlay resolves on error.
#
# Trigger: manual (workflow_dispatch) — optional ADMIN_EMAIL / ADMIN_PASSWORD
# inputs switch it to the real success (redirect) path.
name: Investigate login hang

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target base URL'
        required: false
        default: 'https://foodexperience.agilexplus.dev'
      admin_email:
        description: 'Admin email (leave empty for failure-path probe)'
        required: false
        default: ''
      admin_password:
        description: 'Admin password (leave empty for failure-path probe)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  investigate:
    name: Probe login spinner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run login probe
        run: node scripts/probe-v4-success.mjs
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://foodexperience.agilexplus.dev' }}
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password }}

      - name: Upload probe artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: investigate-login
          path: investigate-login/
          retention-days: 7