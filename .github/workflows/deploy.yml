# deploy.yml — OIDC deployment (distilled from ci-transfer-app).
#
# Authentication is OIDC: azure/login exchanges this run's GitHub token for
# an Azure token against an app registration whose federated credential trusts
# this repository and the target environment. The three Azure identifiers are
# environment VARIABLES (`vars.`), NOT secrets — there is no client secret to
# store. The deploy-guard job in ci.yml fails if a `secrets.*` reference ever
# appears here.
#
# Promotion model:
#   - merge to main  → auto-deploy to test (foodexperience.agilexplus.dev)
#   - prod deploy    → manual workflow_dispatch with explicit approval
#     (foodexperience.mt)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        required: true
        options:
          - test
          - prod

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write       # Required for OIDC azure/login
  packages: write       # To push Docker images

jobs:
  # ── Resolve environment ──────────────────────────────────────
  resolve-env:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "environment=test" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy ───────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [resolve-env]
    environment:
      name: ${{ needs.resolve-env.outputs.environment }}
      url: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker with ACR
        run: |
          ACR_NAME="${ACR_FQDN%%.*}"
          az acr login --name "$ACR_NAME" --only-show-errors
        shell: bash
        env:
          ACR_FQDN: ${{ vars.ACR_FQDN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_FQDN }}/mfa-food-experience:${{ needs.resolve-env.outputs.environment }}-${{ github.sha }}
            ${{ vars.ACR_FQDN }}/mfa-food-experience:latest-${{ needs.resolve-env.outputs.environment }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}

      - name: Ensure durable media volume is mounted
        # Payload writes uploads to staticDir public/storage = /app/public/storage.
        # The Container App must mount the Azure Files volume there, or every new
        # revision silently wipes uploads -- an uploaded event image started
        # 500ing exactly that way on 2026-10-16. Idempotent: a no-op when the
        # mount is present, and it fails this deploy if it cannot be established,
        # so the mount can never regress silently again.
        run: ./infra/ensure-media-storage.sh
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash

      - name: Store the app's secrets in the Container App
        # Secrets live in GitHub environment secrets and in Container App
        # secrets, never in plain variables or plain environment values. The
        # vars fallback only covers the switch-over; remove it once the
        # variables are deleted.
        run: |
          az containerapp secret set \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --secrets \
              "database-url=${{ secrets.DATABASE_URL || vars.DATABASE_URL }}" \
              "payload-secret=${{ secrets.PAYLOAD_SECRET || vars.PAYLOAD_SECRET }}" \
              "cron-secret=${{ secrets.CRON_SECRET || 'unset' }}" \
              "smtp-pass=${{ secrets.SMTP_PASS || 'unset' }}" \
              "nextauth-secret=${{ secrets.NEXTAUTH_SECRET || 'unset' }}" \
              "viva-client-secret=${{ secrets.VIVA_CLIENT_SECRET || 'unset' }}" \
              "viva-api-key=${{ secrets.VIVA_API_KEY || 'unset' }}" \
              "viva-webhook-secret=${{ secrets.VIVA_WEBHOOK_SECRET || 'unset' }}" \
            --output none
        shell: bash

      - name: Guard prod environment configuration
        # On 2026-11-04 the prod environment still pointed RESOURCE_GROUP at
        # mfa-food-experience-test with zero secrets, so a prod dispatch would
        # have deployed onto the TEST app believing it was foodexperience.mt.
        # That must fail loudly instead.
        if: needs.resolve-env.outputs.environment == 'prod'
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [ "${{ vars.RESOURCE_GROUP }}" != "mfa-food-experience-test" ] \
            || fail "prod RESOURCE_GROUP points at the TEST resource group"
          [ "${{ vars.CONTAINER_APP_NAME }}" != "mfa-food-experience" ] \
            || fail "prod CONTAINER_APP_NAME is the TEST container app"
          [ -n "${{ vars.NEXT_PUBLIC_SERVER_URL }}" ] \
            || fail "prod NEXT_PUBLIC_SERVER_URL is not set"
          [ "${{ vars.VIVA_DEMO_MODE }}" = "false" ] \
            || fail "prod VIVA_DEMO_MODE must be 'false'"

          echo "prod configuration looks sane"
        shell: bash

      - name: Apply migrations (deploy-time job)
        # Migrations belong here, not in the container entrypoint: a failure
        # then fails THIS deploy while the previous revision keeps serving,
        # instead of crash-looping the site (incident 2026-11-04).
        #
        # Gated on vars.MIGRATE_JOB_ENABLED so this can be rolled out without
        # risking the deploy path: until it is set to 'true' the entrypoint
        # keeps migrating at boot and nothing here runs.
        if: vars.MIGRATE_JOB_ENABLED == 'true'
        id: migrate
        run: |
          set -euo pipefail

          ENV_ID=$(az containerapp show \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --query properties.managedEnvironmentId -o tsv)
          ENV_NAME="${ENV_ID##*/}"

          JOB="mfa-migrate-${{ needs.resolve-env.outputs.environment }}"
          IMAGE="${{ vars.ACR_FQDN }}/mfa-food-experience:${{ needs.resolve-env.outputs.environment }}-${{ github.sha }}"

          create() {
            az containerapp job create \
              --name "$JOB" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --environment "$ENV_NAME" \
              --trigger-type Manual \
              --replica-timeout 900 \
              --replica-retry-limit 0 \
              --image "$IMAGE" \
              --cpu 1 --memory 2Gi \
              --secrets \
                "database-url=${{ secrets.DATABASE_URL }}" \
                "payload-secret=${{ secrets.PAYLOAD_SECRET }}" \
              --env-vars \
                "DATABASE_URL=secretref:database-url" \
                "PAYLOAD_SECRET=secretref:payload-secret" \
              --command "./infra/migrate.sh" \
              --output none
          }

          # Create on first use, update on every later deploy so the job always
          # runs this commit's image.
          if az containerapp job show --name "$JOB" \
               --resource-group "${{ vars.RESOURCE_GROUP }}" -o none 2>/dev/null; then
            az containerapp job update \
              --name "$JOB" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --image "$IMAGE" \
              --secrets \
                "database-url=${{ secrets.DATABASE_URL }}" \
                "payload-secret=${{ secrets.PAYLOAD_SECRET }}" \
              --output none
          else
            create
          fi

          az containerapp job start \
            --name "$JOB" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --output none

          echo "Waiting for the migration job to finish..."
          for i in $(seq 1 60); do
            STATUS=$(az containerapp job execution list \
              --name "$JOB" \
              --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --query "[0].properties.status" -o tsv 2>/dev/null || echo "")
            case "$STATUS" in
              Succeeded) echo "Migrations applied."; exit 0 ;;
              Failed|Degraded)
                echo "::error::Migration job finished with status $STATUS"
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::Migration job did not finish within 10 minutes"
          exit 1
        shell: bash

      - name: Deploy to Azure Container Apps
        run: |
          # HOSTNAME=0.0.0.0 forces the Next.js standalone server to bind all
          # interfaces (otherwise it inherits the platform hostname and the
          # startup probe can miss it). The ingress target port is already set
          # to 3000 on the Container App and persists across `update` calls.
          az containerapp update \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --image "${{ vars.ACR_FQDN }}/mfa-food-experience:${{ needs.resolve-env.outputs.environment }}-${{ github.sha }}" \
            --set-env-vars \
              "NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}" \
              "DATABASE_URL=secretref:database-url" \
              "PAYLOAD_SECRET=secretref:payload-secret" \
              "CRON_SECRET=secretref:cron-secret" \
              "SMTP_HOST=${{ vars.SMTP_HOST }}" \
              "SMTP_PORT=${{ vars.SMTP_PORT }}" \
              "SMTP_USER=${{ vars.SMTP_USER }}" \
              "SMTP_PASS=secretref:smtp-pass" \
              "FROM_EMAIL=${{ vars.FROM_EMAIL }}" \
              "FROM_NAME=${{ vars.FROM_NAME }}" \
              "NEXTAUTH_SECRET=secretref:nextauth-secret" \
              "HOSTNAME=0.0.0.0" \
              "PORT=3000" \
              "VIVA_CLIENT_ID=${{ secrets.VIVA_CLIENT_ID }}" \
              "VIVA_CLIENT_SECRET=secretref:viva-client-secret" \
              "VIVA_API_KEY=secretref:viva-api-key" \
              "VIVA_SOURCE_CODE=${{ vars.VIVA_SOURCE_CODE }}" \
              "VIVA_MERCHANT_ID=${{ vars.VIVA_MERCHANT_ID }}" \
              "VIVA_WEBHOOK_SECRET=secretref:viva-webhook-secret" \
              "VIVA_DEMO_MODE=${{ vars.VIVA_DEMO_MODE }}" \
            --output none
        shell: bash

      - name: Stop migrating at container start
        # Only reached when the migration job above ran and succeeded, so the
        # schema is already current for this image.
        if: vars.MIGRATE_JOB_ENABLED == 'true'
        run: |
          az containerapp update \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --set-env-vars "SKIP_BOOT_MIGRATIONS=true" \
            --output none
        shell: bash
