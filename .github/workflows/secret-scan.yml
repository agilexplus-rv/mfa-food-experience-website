# secret-scan.yml — Gitleaks secret scanning.
#
# Scans the diff (PRs) or full history (pushes) for hardcoded secrets using
# Gitleaks' default ruleset plus repo-specific allowlist entries in
# .gitleaks.toml. Full git history is checked out (fetch-depth: 0) because
# gitleaks-action diffs against history to find newly introduced secrets.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
